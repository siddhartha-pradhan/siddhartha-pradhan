name: CI Pipeline & Worflows.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installation of Dependencies
        run: npm ci

      - name: Run Dynamic Readme Script
        run: node readme.js

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Auto Update on README File via CI Pipeline." || exit 0
          git push
